name: Keep Render service awake

on:
  schedule:
    # Every 10 minutes (GitHub cron runs in UTC; interval is what matters here)
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        run: |
          curl --silent --show-error --fail \
            --max-time 120 \
            --retry 3 --retry-delay 15 --retry-all-errors \
            https://op-kzju.onrender.com/health